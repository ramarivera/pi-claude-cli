schema: spec-driven
context: |
  TypeScript Pi extension; planned neutral core with official SDK/CLI drivers and Pi/OMP adapters.
  Implementation is deferred until Ramiro explicitly says to start.
  Exactly-one-owner tools, native schemas, own Claude login and four real host/driver E2E cases are required.
  OpenSpec owns requirements; beads owns statuses/dependencies; lanes.json owns file allocation.
  Preserve historical .planning evidence; this change supersedes historical SDK exclusion for this effort.
rules:
  tasks:
    - Mirror each checkbox with a bead, owned files, blockers and acceptance evidence.
    - Keep slices below two hours; freeze contracts before parallel writes; max three active lanes.
operations:
  apply:
    guidance:
      - Do not start while implementation-start is deferred.
      - Use one integration owner for shared files and approved dependencies.
      - Live tests require opt-in and account/usage readiness; unrun combinations remain incomplete.

